name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-x11:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt5 python3-gi xvfb xauth dbus-x11 libx11-6 libxtst6
      - name: Test on an isolated X11 display
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: '1'
          QT_QPA_PLATFORM: xcb
          QT_XCB_GL_INTEGRATION: none
          QT_IM_MODULE: compose
          CLIPBOARD_ISOLATED_TEST: '1'
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1100x850x24 -nolisten tcp' /usr/bin/python3 -m unittest discover -s tests -v
      - name: Build Ubuntu source package
        run: /usr/bin/python3 packaging/build_deb.py
      - name: Install, smoke-test, upgrade and remove the Ubuntu package
        run: |
          sudo apt-get install -y ./dist/*.deb
          dbus-run-session -- xvfb-run -a simple-clipboard --smoke-test "$PWD/dist/linux-smoke.json"
          sudo apt-get install --reinstall -y ./dist/*.deb
          sudo apt-get remove -y simple-clipboard
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ubuntu-22.04-x11-preview
          path: dist/
          retention-days: 14

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            label: windows-x64
          - runner: macos-14
            label: macos-arm64
          - runner: macos-15-intel
            label: macos-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      CLIPBOARD_DISPOSABLE_DESKTOP: '1'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-build.txt
      - name: Test on the native disposable desktop
        run: python -m unittest discover -s tests -v
      - name: Collect exact corresponding sources and notices
        run: python packaging/collect_sources.py
      - name: Build application
        run: python -m PyInstaller --noconfirm packaging/app.spec
      - name: Verify Windows executable and build installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'dist/windows-smoke.json'
          $process = Start-Process -FilePath 'dist/SimpleClipboard/SimpleClipboard.exe' -ArgumentList "--smoke-test `"$report`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Packaged startup failed' }
          if (!(Get-Content $report | ConvertFrom-Json).ok) { throw 'Smoke report failed' }
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Verify macOS application and create disk image
        if: runner.os == 'macOS'
        run: |
          dist/SimpleClipboard.app/Contents/MacOS/SimpleClipboard --smoke-test "$PWD/dist/macos-smoke.json"
          codesign --verify --deep --strict dist/SimpleClipboard.app
          mkdir -p build/dmg
          cp -R dist/SimpleClipboard.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname 'Simple Clipboard Preview' -srcfolder build/dmg -ov -format UDZO 'dist/SimpleClipboard-0.3.0-preview-${{ matrix.label }}.dmg'
      - name: Upload corresponding sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.label }}-sources
          path: sources/
          compression-level: 0
          retention-days: 14
      - name: Upload preview installer and startup report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.label }}-preview
          path: |
            dist/*-setup.exe
            dist/*.dmg
            dist/*-smoke.json
          retention-days: 14
